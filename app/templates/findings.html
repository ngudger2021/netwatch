{% extends "base.html" %}
{% block title %}Security findings{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
  <div><h1 class="h3 mb-0">Security findings</h1>
  <p class="small text-secondary mb-0">Evidence-based, non-intrusive checks. An open port alone is not a vulnerability.</p></div>
  <div class="d-flex gap-2">
    <select id="fs-status" class="form-select form-select-sm" style="width:auto">
      <option value="open">Open</option><option value="acknowledged">Acknowledged</option><option value="resolved">Resolved</option><option value="all">All</option></select>
    <button id="vuln-check" class="btn btn-sm btn-outline-warning admin-only" title="Looks up public exploit references for detected versions. Does not contact devices.">Check known exploits</button>
    <button id="vuln-vulners" class="btn btn-sm btn-outline-warning admin-only" title="Asks nmap's vulners script for CVEs. Sends service names and versions to vulners.com.">CVE check (vulners)</button>
    <button id="vuln-nuclei" class="btn btn-sm btn-outline-danger admin-only" title="Sends HTTP requests to web ports with read-only exposure templates.">Web exposure (Nuclei)</button>
    <span id="vuln-status" class="small text-secondary align-self-center"></span>
    <select id="fs-sev" class="form-select form-select-sm" style="width:auto">
      <option value="">Any severity</option><option>critical</option><option>high</option><option>medium</option><option>low</option><option>info</option></select>
  </div>
</div>
<div class="card nw-card"><div class="table-responsive">
  <table class="table table-dark table-hover mb-0 nw-table">
    <thead><tr><th>Severity</th><th>Finding</th><th>Device</th><th>Port</th><th>Evidence</th><th>Remediation</th><th>Status</th><th>Detected</th><th></th></tr></thead>
    <tbody id="findings-body"></tbody></table></div></div>
<nav class="d-flex justify-content-end gap-2 mt-2 small"><div class="btn-group btn-group-sm">
  <button class="btn btn-outline-secondary" id="fn-prev">Previous</button><button class="btn btn-outline-secondary" id="fn-next">Next</button></div></nav>
{% endblock %}
