[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kali-netwatch"
version = "1.0.0"
description = "Network discovery, auditing and monitoring for Kali Linux (Raspberry Pi)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.0",
  "jinja2==3.1.6",
  "psutil==7.0.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
